<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="text-align: center;">
    <canvas id="canvas" width="400" height="200" style="margin: 8em; border: 1px solid black;"></canvas>
    <div></div>
    <input id="slider" type="range" min="0" max="6.283185" step="0.001" style="width: 30em;">
</body>
<script>
    "use strict";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("slider");

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;

    const scale = 0.1;
    const width = canvasWidth * scale;
    const height = canvasHeight * scale;

    const xMin = -0.5 * width;
    const xMax = 0.5 * width;
    const yMin = -0.5 * height;
    const yMax = 0.5 * height;

    const dt = 0.1;
    const numParticles = 1;

    const gravityMultiplier = 1;
    const wallRestitution = 1;
    const kernelRadius = 2;
    const pressureMultiplier = 0;
    const viscosityMultiplier = 0;
    const damping = 0.0;

    let gravity = [0, -1];
    let lastRotation = 0;
    const rotationDamp = 0.3;

    // TODO: change to inertial frame + use floating origin in case of frame accelerations / moving
    const positions = Array.from(
        { length: numParticles },
        _ => [
            (Math.random() - 0.5) * width,
            (Math.random() - 0.5) * height
        ]
    );
    const predictedPositions = Array.from(
        { length: numParticles },
        _ => [0, 0]
    );
    const velocities = Array.from(
        { length: numParticles },
        _ => [
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.5) * 2
        ]
    );
    const densities = Array.from(
        { length: numParticles },
        _ => 0
    );

    const smoothingKernel = (distance) => {
        const normalized = distance / kernelRadius;
        const value = Math.max(1 - normalized * normalized, 0);
        return value * value * value;
    };

    const d_smoothingKernel = (distance) => {
        const normalized = distance / kernelRadius;
        const value = Math.max(1 - normalized * normalized, 0);
        return -6 * value * value * normalized / kernelRadius;
    };

    const calculateDensity = (index) => {
        let res = 0;

        for (let i = 0; i < numParticles; i++) {
            if (index == i) continue;

            const dx = predictedPositions[i][0] - predictedPositions[index][0];
            const dy = predictedPositions[i][1] - predictedPositions[index][1];
            const dist = Math.sqrt(dx * dx + dy * dy)

            res += smoothingKernel(dist)
        }

        return res
    };

    const calculateForce = (index) => {
        let resx = 0;
        let resy = 0;

        for (let i = 0; i < numParticles; i++) {
            if (index == i) continue;

            // pressure
            const dx = predictedPositions[i][0] - predictedPositions[index][0];
            const dy = predictedPositions[i][1] - predictedPositions[index][1];
            const dist = Math.sqrt(dx * dx + dy * dy)

            const dirx = dist > 0 ? dx / dist : Math.random() - 0.5;
            const diry = dist > 0 ? dy / dist : Math.random() - 0.5;

            const density = densities[i];
            const pressureSlope = d_smoothingKernel(dist);
            const pressure = density * pressureSlope;

            resx += pressure * dirx * pressureMultiplier;
            resy += pressure * diry * pressureMultiplier;

            // viscosity
            const dvx = velocities[i][0] - velocities[index][0];
            const dvy = velocities[i][1] - velocities[index][1];

            const viscosityInfluence = smoothingKernel(dist);

            resx += dvx * viscosityInfluence * viscosityMultiplier;
            resy += dvy * viscosityInfluence * viscosityMultiplier;
        }

        return [resx, resy];
    };

    const simUpdate = () => {
        const sliderRotation = slider.value - Math.PI;
        const currentRotation = lastRotation + (sliderRotation - lastRotation) * rotationDamp;
        // const currentRotation = lastRotation + 0.2 * dt;
        gravity = [
            gravityMultiplier * Math.sin(currentRotation),
            gravityMultiplier * -Math.cos(currentRotation)
        ];
        canvas.style.transform = `rotateZ(${currentRotation}rad)`;

        const dRotation = currentRotation - lastRotation;
        const c = Math.cos(dRotation);
        const s = Math.sin(dRotation);
        lastRotation = currentRotation;

        for (let i = 0; i < numParticles; i++) {
            positions[i][0] = c * positions[i][0] - s * positions[i][1];
            positions[i][1] = s * positions[i][0] + c * positions[i][1];

            velocities[i][0] = c * velocities[i][0] - s * velocities[i][1];
            velocities[i][1] = s * velocities[i][0] + c * velocities[i][1];
        }

        for (let i = 0; i < numParticles; i++) {
            predictedPositions[i][0] = positions[i][0] + velocities[i][0] * dt;
            predictedPositions[i][1] = positions[i][1] + velocities[i][1] * dt;
        }

        for (let i = 0; i < numParticles; i++) {
            densities[i] = calculateDensity(i);
        }

        for (let i = 0; i < numParticles; i++) {
            const force = calculateForce(i);

            velocities[i][0] += force[0] * dt;
            velocities[i][1] += force[1] * dt;

            velocities[i][0] += gravity[0] * dt;
            velocities[i][1] += gravity[1] * dt;

            velocities[i][0] -= damping * velocities[i][0] * dt;
            velocities[i][1] -= damping * velocities[i][1] * dt;

            positions[i][0] += velocities[i][0] * dt;
            positions[i][1] += velocities[i][1] * dt;

            if (positions[i][0] < xMin) {
                const penetration = xMin - positions[i][0];
                positions[i][0] = xMin + wallRestitution * penetration;
                velocities[i][0] += (1 + wallRestitution) * penetration / dt;
            }

            if (positions[i][0] > xMax) {
                const penetration = positions[i][0] - xMax;
                positions[i][0] = xMax - wallRestitution * penetration;
                velocities[i][0] -= (1 + wallRestitution) * penetration / dt;

            }

            if (positions[i][1] < yMin) {
                const penetration = yMin - positions[i][1];
                positions[i][1] = yMin + wallRestitution * penetration;
                velocities[i][1] *= -wallRestitution;
                // velocities[i][1] += penetration / dt;
                // velocities[i][1] += (1 + wallRestitution) * penetration / dt;
            }

            if (positions[i][1] > yMax) {
                const penetration = positions[i][1] - yMax;
                positions[i][1] = yMax - wallRestitution * penetration;
                velocities[i][1] -= (1 + wallRestitution) * penetration / dt;
            }
        }
    };

    const renderUpdate = () => {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        ctx.fillStyle = "black";
        for (let i = 0; i < numParticles; i++) {
            ctx.beginPath();
            ctx.arc(
                0.5 * canvasWidth + positions[i][0] / scale,
                0.5 * canvasHeight - positions[i][1] / scale,
                3,
                0, 2 * Math.PI
            );
            ctx.fill();
        }
    };

    const update = () => {
        renderUpdate();
        simUpdate();

        requestAnimationFrame(() => {
            update();
        });
    }

    update();
</script>

</html>
