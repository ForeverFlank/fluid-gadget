<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="text-align: center;">
    <canvas id="canvas" width="512" height="256"
        style="margin-top: 8em; margin-bottom: 8em; border: 1px solid black;"></canvas>
    <div></div>
    <input id="slider" type="range" min="0" max="6.283185" step="0.001" style="width: 30em;">
    <p id="debug"></p>
</body>
<script>
    "use strict";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("slider");

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;

    const scale = 16 / 512;
    const width = canvasWidth * scale;
    const height = canvasHeight * scale;

    const xMin = -0.5 * width;
    const xMax = 0.5 * width;
    const yMin = -0.5 * height;
    const yMax = 0.5 * height;

    const dt = 0.1;
    const substeps = 8;
    const h = dt / substeps;

    const numParticles = 512;

    const kernelRadius = 0.5;
    const pressureMultiplier = 4;
    const viscosityMultiplier = 0.2;
    const damping = 0.05;
    const wallRestitution = 0.5;

    let gravity = [0, -1];
    let currentRotation = 0;
    let lastRotation = currentRotation;
    const rotationDamp = 0.01;

    const positions = Array.from(
        { length: numParticles },
        _ => [
            (Math.random() - 0.5) * width,
            (Math.random() - 0.5) * height
        ]
    );
    const predictedPositions = Array.from(
        { length: numParticles },
        _ => [0, 0]
    );
    const velocities = Array.from(
        { length: numParticles },
        _ => [0, 0]
    );
    const densities = Array.from(
        { length: numParticles },
        _ => 0
    );

    const containerHyp = Math.sqrt(width * width, height * height);
    const spatialGridSize = Math.ceil(containerHyp / kernelRadius);

    const spatialGrid = Array.from(
        { length: spatialGridSize },
        _ => Array.from(
            { length: spatialGridSize },
            _ => []
        )
    );

    const smoothingKernel = (distance) => {
        const normalized = distance / kernelRadius;
        const value = Math.max(1 - normalized * normalized, 0);
        return value * value * value;
    };

    const d_smoothingKernel = (distance) => {
        const normalized = distance / kernelRadius;
        const value = Math.max(1 - normalized * normalized, 0);
        return -6 * value * value * normalized / kernelRadius;
    };

    const spatialGridCoord = (index) => {
        let xi = Math.floor(
            (predictedPositions[index][0] + containerHyp * 0.5) / kernelRadius);
        let yi = Math.floor(
            (predictedPositions[index][1] + containerHyp * 0.5) / kernelRadius);

        if (xi < 0) xi = 0;
        if (xi >= spatialGridSize) xi = spatialGridSize - 1;

        if (yi < 0) yi = 0;
        if (yi >= spatialGridSize) yi = spatialGridSize - 1;

        return [xi, yi];
    }

    const updateSpatialGrid = () => {
        for (let i = 0; i < spatialGridSize; i++) {
            for (let j = 0; j < spatialGridSize; j++) {
                spatialGrid[i][j].length = 0;   // only in JS!
            }
        }

        for (let i = 0; i < numParticles; i++) {
            let [xi, yi] = spatialGridCoord(i);

            spatialGrid[xi][yi].push(i);
        }
    };

    const nearbyIndices = (index) => {
        let res = [];

        let [xi, yi] = spatialGridCoord(index);

        const xiMin = Math.max(xi - 1, 0);
        const xiMax = Math.min(xi + 1, spatialGridSize - 1);
        const yiMin = Math.max(yi - 1, 0);
        const yiMax = Math.min(yi + 1, spatialGridSize - 1);

        for (let xi = xiMin; xi <= xiMax; xi++) {
            for (let yi = yiMin; yi <= yiMax; yi++) {
                res = res.concat(spatialGrid[xi][yi]);
            }
        }

        return res;
    }

    const calculateDensity = (index) => {
        let res = 0;

        let [xi, yi] = spatialGridCoord(index);

        for (let i of nearbyIndices(index)) {
            if (index == i) continue;

            const dx = predictedPositions[i][0] - predictedPositions[index][0];
            const dy = predictedPositions[i][1] - predictedPositions[index][1];
            const dist = Math.sqrt(dx * dx + dy * dy)

            if (dist > kernelRadius) continue;

            res += smoothingKernel(dist)
        }

        return res
    };

    const calculateForce = (index) => {
        let resx = gravity[0];
        let resy = gravity[1];

        let [xi, yi] = spatialGridCoord(index);

        for (let i of nearbyIndices(index)) {
            if (index == i) continue;

            const dx = predictedPositions[i][0] - predictedPositions[index][0];
            const dy = predictedPositions[i][1] - predictedPositions[index][1];
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > kernelRadius) continue;

            // pressure
            const dirx = dist > 0 ? dx / dist : Math.random() - 0.5;
            const diry = dist > 0 ? dy / dist : Math.random() - 0.5;

            const density = densities[i];
            const pressureSlope = d_smoothingKernel(dist);
            const pressure = density * pressureSlope;

            resx += pressure * dirx * pressureMultiplier;
            resy += pressure * diry * pressureMultiplier;

            // viscosity
            const dvx = velocities[i][0] - velocities[index][0];
            const dvy = velocities[i][1] - velocities[index][1];

            const viscosityInfluence = smoothingKernel(dist);

            resx += dvx * viscosityInfluence * viscosityMultiplier;
            resy += dvy * viscosityInfluence * viscosityMultiplier;
        }

        return [resx, resy];
    };

    const simUpdate = () => {
        const sliderRotation = slider.value - Math.PI;
        currentRotation = lastRotation + (sliderRotation - lastRotation) * rotationDamp;
        // currentRotation = lastRotation + 0.1 * h;
        // currentRotation = -0.9

        const dRotation = currentRotation - lastRotation;
        lastRotation = currentRotation;

        for (let i = 0; i < numParticles; i++) {
            predictedPositions[i][0] = positions[i][0] + velocities[i][0] * h;
            predictedPositions[i][1] = positions[i][1] + velocities[i][1] * h;
        }

        updateSpatialGrid();

        for (let i = 0; i < numParticles; i++) {
            densities[i] = calculateDensity(i);
        }

        for (let i = 0; i < numParticles; i++) {
            const force = calculateForce(i);

            velocities[i][0] += force[0] * h;
            velocities[i][1] += force[1] * h;

            velocities[i][0] -= damping * velocities[i][0] * h;
            velocities[i][1] -= damping * velocities[i][1] * h;

            positions[i][0] += velocities[i][0] * h;
            positions[i][1] += velocities[i][1] * h;
        }

        const c = Math.cos(currentRotation);
        const s = Math.sin(currentRotation);

        const cd = Math.cos(dRotation);
        const sd = Math.sin(dRotation);

        const walls = [
            { normal: [+c, +s], distance: 0.5 * width },
            { normal: [+s, -c], distance: 0.5 * height },
            { normal: [-c, -s], distance: 0.5 * width },
            { normal: [-s, +c], distance: 0.5 * height },
        ];

        for (let i = 0; i < numParticles; i++) {
            for (const wall of walls) {
                const normal = wall.normal;
                const distance = wall.distance;
                const pdot =
                    normal[0] * (positions[i][0] + normal[0] * distance) +
                    normal[1] * (positions[i][1] + normal[1] * distance);

                if (pdot < 0) {
                    const wallVelx =
                        ((cd - 1) * positions[i][0] - sd * positions[i][1]) / h;
                    const wallVely =
                        (sd * positions[i][0] + (cd - 1) * positions[i][1]) / h;

                    const relVelx = velocities[i][0] - wallVelx;
                    const relVely = velocities[i][1] - wallVely;

                    const vdot = normal[0] * relVelx + normal[1] * relVely;

                    const reflectedVelx =
                        relVelx - (1 + wallRestitution) * vdot * normal[0] + wallVelx;
                    const reflectedVely =
                        relVely - (1 + wallRestitution) * vdot * normal[1] + wallVely;

                    const dtFrac = pdot / vdot;

                    // console.log(dtFrac / h)

                    positions[i][0] -= velocities[i][0] * dtFrac;
                    positions[i][1] -= velocities[i][1] * dtFrac;
                    positions[i][0] += reflectedVelx * dtFrac;
                    positions[i][1] += reflectedVely * dtFrac;

                    velocities[i][0] = reflectedVelx;
                    velocities[i][1] = reflectedVely;
                }
            }
        }
    };

    const renderUpdate = () => {
        canvas.style.transform = `rotateZ(${-currentRotation}rad)`;

        // const Ep = -positions[0][1] * gravity[1];
        // const Ek = 0.5 * (
        //     velocities[0][0] * velocities[0][0] +
        //     velocities[0][1] * velocities[0][1]
        // )
        // const E = Ep + Ek;

        // document.getElementById("debug").innerText =
        //     `${Math.round(E * 100) / 100}`;

        // document.getElementById("debug").innerText = spatialGrid;

        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        ctx.fillStyle = "black";

        const c = Math.cos(-currentRotation);
        const s = Math.sin(-currentRotation);

        for (let i = 0; i < numParticles; i++) {
            const localx = c * positions[i][0] - s * positions[i][1];
            const localy = s * positions[i][0] + c * positions[i][1];

            ctx.beginPath();
            ctx.arc(
                0.5 * canvasWidth + localx / scale,
                0.5 * canvasHeight - localy / scale,
                1.5,
                0, 2 * Math.PI
            );
            ctx.fill();
        }
    };

    const update = () => {
        renderUpdate();

        for (let i = 0; i < substeps; i++) {
            simUpdate();
        }

        // setTimeout(update, 100)
        requestAnimationFrame(update);
    }

    update();
</script>

</html>
